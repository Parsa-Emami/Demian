name: Reference art mobile QA
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/reference-art-mobile.yml'
      - 'demian/tools/check_reference_art_mobile.mjs'
      - 'demian/docs/character-reference-v2/**'
      - 'demian/public/assets/characters/darya/**'
      - 'demian/public/assets/characters/arsal/**'
      - 'demian/resources/js/game/characters/**'
      - 'demian/resources/js/game/games/open-world/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reference-art-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demian/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: npm ci
      - run: npm run validate:character-art
      - run: npm run build:static
      - run: npm run validate:build
      - run: npm run validate:static-assets
      - run: npx playwright install chromium --only-shell
      - name: Record Darya and Arsal in Open World
        timeout-minutes: 4
        run: node tools/check_reference_art_mobile.mjs --site _site --out "$RUNNER_TEMP/reference-art-mobile" --sha "$GITHUB_SHA"
      - name: Verify Arsal V15 in the games
        timeout-minutes: 4
        run: npm run test:arsal:browser
        env:
          DEMIAN_QA_SITE: _site
          DEMIAN_QA_REPORT_DIR: ${{ runner.temp }}/reference-art-mobile
          DEMIAN_QA_SCREENSHOT_DIR: ${{ runner.temp }}/reference-art-mobile/arsal-v15
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reference-art-mobile-${{ github.sha }}
          path: ${{ runner.temp }}/reference-art-mobile
          if-no-files-found: ignore
          retention-days: 90
