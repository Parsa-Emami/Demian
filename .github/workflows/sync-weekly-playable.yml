name: Build weekly playable candidate
on:
  push:
    branches: [build/sync-weekly-playable]
permissions:
  contents: write
concurrency:
  group: weekly-playable-candidate
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demian/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: npm ci
        working-directory: demian
      - run: npm run build:static && npm run validate:static-assets && npm run validate:build
        working-directory: demian
      - name: Commit generated output to the build branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/build/sync-weekly-playable
          rsync -a --delete demian/_site/ playable/
          git add -- playable/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: refresh the weekly playable release"
          git push --force-with-lease="refs/heads/build/sync-weekly-playable:$EXPECTED_SHA" origin HEAD:refs/heads/build/sync-weekly-playable
      - run: npx playwright install chromium --only-shell
        working-directory: demian
      - name: Check weekly Café Critters
        run: timeout 180s npm run test:cafe-critters-step27:browser
        working-directory: demian
      - name: Check weekly Coffee Crash and its leaderboard
        run: timeout 180s npm run test:coffee-crash-step28:browser
        working-directory: demian
      - name: Check After Hours visibility and finish
        if: success() || failure()
        run: timeout 180s npm run test:after-hours-step25:browser
        working-directory: demian
      - name: Check service station interactions
        if: success() || failure()
        run: timeout 180s npm run test:cafe-rush-step26:browser
        working-directory: demian
      - name: Check twelve character portraits
        if: success() || failure()
        run: timeout 180s node tools/check_phase6_step31_mobile_home.mjs
        working-directory: demian
