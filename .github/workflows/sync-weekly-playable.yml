name: Build Demian cast candidate
on:
  push:
    branches: [build/sync-weekly-playable]
permissions:
  contents: write
concurrency:
  group: weekly-playable-candidate
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demian/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
        working-directory: demian
      - run: npm ci
        working-directory: demian
      - name: Build the release with the checked character packs
        working-directory: demian
        run: npm run build:static
      - name: Verify the character assets and release
        working-directory: demian
        run: |
          npm run validate:characters:v14
          npm run validate:motion
          npm run validate:ui-layers
          npm run validate:static-assets
          npm run validate:build
      - name: Store the generated assets and static site on the build branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/build/sync-weekly-playable
          rsync -a --delete demian/_site/ playable/
          git add -- demian/public/assets/characters demian/docs/release-v14/asset-validation.json playable/
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: refresh Demian character packs and playable release"
          git push --force-with-lease="refs/heads/build/sync-weekly-playable:$EXPECTED_SHA" origin HEAD:refs/heads/build/sync-weekly-playable
      - run: npx playwright install chromium --only-shell
        working-directory: demian
      - name: Check both characters in four games
        working-directory: demian
        run: timeout 210s node tools/check_added_cast_v14.mjs
      - name: Check the fourteen portraits on desktop and phone
        working-directory: demian
        run: timeout 120s node tools/check_phase6_step31_mobile_home.mjs
