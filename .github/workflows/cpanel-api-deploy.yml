name: Demian cPanel Laravel API (manual and gated)
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Isolated cPanel environment"
        type: choice
        required: true
        options: [staging, production]
      production_acknowledgement:
        description: "Production only: DEPLOY_PRODUCTION_WITH_BACKUP"
        type: string
        required: false
      backup_receipt:
        description: "Independent encrypted offsite backup + restore receipt (production)"
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: demian-cpanel-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/arcade-backend.yml
  package:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, pdo_mysql, curl, fileinfo
          coverage: none
      - name: Verify exact-main-SHA PR06 artifact acceptance before manual packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
          jq -e --arg sha "$GITHUB_SHA" '
            .workflow_runs | any(
              .head_sha == $sha and .head_branch == "main"
              and .name == "PR06 cPanel release acceptance (CI only)"
              and (.event == "push" or .event == "workflow_dispatch")
              and .conclusion == "success"
            )
          ' <<< "$runs" >/dev/null || {
            echo "Exact main SHA lacks successful PR06 no-host rehearsal" >&2
            exit 1
          }
      - name: Install locked PHP production dependencies
        working-directory: demian
        run: composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader
      - name: Prepare secure, backend-only Laravel artifact
        shell: bash
        working-directory: demian
        run: |
          set -Eeuo pipefail
          test -s ops/cpanel/host_preflight.php
          bash ops/cpanel/package_release.sh "$RUNNER_TEMP" "$GITHUB_SHA"
          test -s "$RUNNER_TEMP/demian-cpanel.manifest.json"
          grep -Eq '^[a-f0-9]{64}$' "$RUNNER_TEMP/demian-cpanel.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cpanel-api-release
          path: |
            ${{ runner.temp }}/demian-cpanel.tar.gz
            ${{ runner.temp }}/demian-cpanel.sha256
            ${{ runner.temp }}/demian-cpanel.manifest.json
          if-no-files-found: error
          retention-days: 2
  deploy:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: cpanel-${{ inputs.target }}
      url: ${{ vars.CPANEL_API_ORIGIN }}
    env:
      CPANEL_TARGET: ${{ inputs.target }}
      CPANEL_CONFIRM: ${{ inputs.production_acknowledgement }}
      BACKUP_RECEIPT: ${{ inputs.backup_receipt || '-' }}
      CPANEL_HOST: ${{ vars.CPANEL_SSH_HOST }}
      CPANEL_USER: ${{ vars.CPANEL_SSH_USER }}
      CPANEL_ROOT: ${{ vars.CPANEL_API_ROOT }}
      CPANEL_PHP_BIN: ${{ vars.CPANEL_PHP_BIN }}
      CPANEL_WEBROOT: ${{ vars.CPANEL_WEBROOT || '' }}
      CPANEL_API_ORIGIN: ${{ vars.CPANEL_API_ORIGIN }}
      CPANEL_CLIENT_ORIGIN: ${{ vars.CPANEL_CLIENT_ORIGIN }}
      CPANEL_SSH_KEY: ${{ secrets.CPANEL_DEPLOY_SSH_KEY }}
      CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpanel-api-release
          path: .cpanel-release
      - name: Require separate production approval and hosting configuration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          [[ "$CPANEL_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$CPANEL_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$CPANEL_ROOT" == "/home/$CPANEL_USER/"* && "$CPANEL_ROOT" != *..* ]]
          [[ "$CPANEL_PHP_BIN" =~ ^[A-Za-z0-9_./-]+$ ]]
          url_re='^https://[A-Za-z0-9.-]+(:[0-9]+)?$'
          [[ "$CPANEL_API_ORIGIN" =~ $url_re ]]
          [[ "$CPANEL_CLIENT_ORIGIN" =~ $url_re && "$CPANEL_CLIENT_ORIGIN" != "$CPANEL_API_ORIGIN" ]]
          if [[ -n "$CPANEL_WEBROOT" ]]; then
            [[ "$CPANEL_WEBROOT" == "/home/$CPANEL_USER/"* ]]
            [[ "$CPANEL_WEBROOT" =~ ^/home/[A-Za-z0-9_./-]+$ && "$CPANEL_WEBROOT" != *..* ]]
            [[ "$CPANEL_WEBROOT" != "$CPANEL_ROOT/"* ]]
          fi
          [[ -n "$CPANEL_SSH_KEY" && -n "$CPANEL_KNOWN_HOSTS" ]]
          [[ "$BACKUP_RECEIPT" =~ ^[A-Za-z0-9_.:-]+$ ]]
          if [[ "$CPANEL_TARGET" == production ]]; then
            [[ "$CPANEL_CONFIRM" == DEPLOY_PRODUCTION_WITH_BACKUP ]]
            [[ "$BACKUP_RECEIPT" =~ ^[a-f0-9]{64}$ ]] || {
              echo "Production requires a SHA-256 off-host backup/restore receipt" >&2
              exit 1
            }
            [[ "$GITHUB_REF_PROTECTED" == true ]] || {
              echo "Production denied: unprotected main branch or missing ruleset" >&2
              exit 1
            }
            environment_json="$(gh api "/repos/$GITHUB_REPOSITORY/environments/cpanel-production")" || {
              echo "Cannot verify cpanel-production Environment security" >&2
              exit 1
            }
            jq -e '.prevent_self_review == true and
              (.protection_rules | any(.type == "required_reviewers" and
              ((.reviewers // []) | length >= 1)))' <<< "$environment_json" >/dev/null || {
              echo "Production requires independent Environment reviewers and self-review prohibition" >&2
              exit 1
            }
            runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            jq -e --arg sha "$GITHUB_SHA" '
              .workflow_runs | any(
                .head_sha == $sha and .head_branch == "main"
                and .name == "Phase 11 protected GO / NO-GO candidate audit"
                and .event == "workflow_dispatch"
                and .conclusion == "success"
              )
            ' <<< "$runs" >/dev/null || {
              echo "Production denied: no exact-SHA, protected human acceptance candidate" >&2
              exit 1
            }
          fi
      - name: Securely upload and deploy as unprivileged cPanel user
        shell: bash
        run: |
          set -Eeuo pipefail
          key="$RUNNER_TEMP/cpanel_key"
          hosts="$RUNNER_TEMP/cpanel_hosts"
          printf '%s\n' "$CPANEL_SSH_KEY" > "$key"
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > "$hosts"
          chmod 600 "$key" "$hosts"
          ssh_flags=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts")
          ssh "${ssh_flags[@]}" "$CPANEL_USER@$CPANEL_HOST" "mkdir -p '$CPANEL_ROOT/incoming'"
          # Reject a stale or substituted manifest before opening SSH.
          php -r '
            $record = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            exit(
              ($record["schema"] ?? null) === 1
              && ($record["commit"] ?? null) === $argv[2]
              && ($record["productionAuthorized"] ?? null) === false
              && ($record["hostDeployed"] ?? null) === false ? 0 : 1
            );
          ' .cpanel-release/demian-cpanel.manifest.json "$GITHUB_SHA"
          expected_digest="$(cat .cpanel-release/demian-cpanel.sha256)"
          [[ "$expected_digest" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$expected_digest" '.cpanel-release/demian-cpanel.tar.gz' |
            sha256sum -c --status || { echo "Downloaded release checksum mismatched"; exit 1; }
          scp "${ssh_flags[@]}" .cpanel-release/demian-cpanel.tar.gz \
            "$CPANEL_USER@$CPANEL_HOST:$CPANEL_ROOT/incoming/$GITHUB_SHA.tar.gz"
          ssh "${ssh_flags[@]}" "$CPANEL_USER@$CPANEL_HOST" \
            "bash -s -- '$GITHUB_SHA' '$CPANEL_ROOT' '$CPANEL_API_ORIGIN' '$CPANEL_TARGET' '$CPANEL_PHP_BIN' '$BACKUP_RECEIPT' '$expected_digest' '$CPANEL_WEBROOT'" \
            < demian/ops/cpanel/deploy.sh
      - name: Public read-only API smoke (bounded)
        run: node demian/tools/smoke_arcade_api.mjs --base-url="$CPANEL_API_ORIGIN/api/v1/arcade" --users=20 --p95-ms=1500
      - name: Step 29 TLS, release identity and private-path acceptance (read-only)
        run: node demian/tools/verify_cpanel_host.mjs --origin="$CPANEL_API_ORIGIN" --release="$GITHUB_SHA" --client-origin="$CPANEL_CLIENT_ORIGIN"