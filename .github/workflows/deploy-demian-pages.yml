name: Deploy Demian Arcade to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demian-github-pages
  cancel-in-progress: true

env:
  PROJECT_DIR: demian
  PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  PAGES_BASE_PATH: /${{ github.event.repository.name }}

jobs:
  build:
    name: Build Demian static demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: demian

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demian/package-lock.json

      - name: Create Laravel environment
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p database
          touch database/database.sqlite

          cat > .env <<EOF_ENV
          APP_NAME="Demian Arcade"
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=${PAGES_URL}
          ASSET_URL=${PAGES_URL}

          APP_LOCALE=fa
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=fa_IR

          LOG_CHANNEL=stderr
          LOG_LEVEL=error

          DB_CONNECTION=sqlite
          DB_DATABASE=${GITHUB_WORKSPACE}/${PROJECT_DIR}/database/database.sqlite

          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync

          FILESYSTEM_DISK=local
          EOF_ENV

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      - name: Prepare Laravel database
        run: |
          php artisan key:generate --force
          php artisan optimize:clear
          php artisan migrate:fresh --force
          php artisan db:seed --class=TiamCharacterSeeder --force
          php artisan route:list

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Verify Vite build
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f public/build/manifest.json ]; then
            echo "ERROR: public/build/manifest.json was not generated."
            exit 1
          fi

          echo "Vite build completed successfully."
          find public/build -maxdepth 2 -type f | sort

      - name: Export Laravel as a static GitHub Pages demo
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            > "${RUNNER_TEMP}/demian-laravel.log" 2>&1 &

          SERVER_PID=$!

          cleanup() {
            kill "${SERVER_PID}" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in {1..40}; do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/ \
              > /dev/null; then

              echo "Laravel server is ready."
              break
            fi

            if [ "${attempt}" -eq 40 ]; then
              echo "ERROR: Laravel server did not become ready."
              cat "${RUNNER_TEMP}/demian-laravel.log" || true
              exit 1
            fi

            sleep 1
          done

          # Copy all browser-accessible files, including the sprite sheet,
          # atlas JSON, and Vite production build.
          cp -a public/. _site/

          rm -f _site/index.php
          rm -f _site/.htaccess
          rm -f _site/hot
          find _site -type l -delete
          touch _site/.nojekyll

          # Render the Blade homepage once while Laravel is available.
          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            http://127.0.0.1:8000/ \
            --output _site/index.html

          # Export the read-only Character Manager data used by the static demo.
          curl \
            --fail \
            --show-error \
            --silent \
            http://127.0.0.1:8000/characters \
            --output _site/characters.json

          python3 <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          site = Path('_site')
          index_path = site / 'index.html'
          html = index_path.read_text(encoding='utf-8')

          pages_url = os.environ['PAGES_URL'].rstrip('/')
          pages_base_path = os.environ['PAGES_BASE_PATH'].rstrip('/')

          # Remove accidental development-server references first. The HTML
          # rendered through `artisan serve` may use the request host instead
          # of APP_URL for route() output.
          html = html.replace('http://127.0.0.1:8000', pages_url)
          html = html.replace('http://localhost:8000', pages_url)

          # GitHub Pages cannot execute the Laravel /characters endpoint.
          # Rewrite the exact data attribute used by CharacterRepository to
          # the exported JSON snapshot. This is intentionally attribute-based
          # so it works regardless of the host Laravel rendered into the URL.
          static_characters_url = f'{pages_base_path}/characters.json'
          html, replacements = re.subn(
              r'data-api-base="[^"]*"',
              f'data-api-base="{static_characters_url}"',
              html,
              count=1,
              flags=re.IGNORECASE,
          )

          if replacements != 1:
              raise SystemExit(
                  'ERROR: Could not rewrite data-api-base for GitHub Pages.'
              )

          # Normalize URLs inside the exported Character Manager JSON as well.
          # This prevents localhost or repository-root paths from breaking the
          # sprite sheet and atlas on project Pages.
          characters_path = site / 'characters.json'
          payload = json.loads(characters_path.read_text(encoding='utf-8'))

          for character in payload.get('data', []):
              for field in ('sprite_url', 'atlas_url'):
                  value = character.get(field)

                  if not value:
                      continue

                  path = urlparse(value).path
                  asset_marker = '/assets/'
                  storage_marker = '/storage/'

                  if asset_marker in path:
                      relative = path.split(asset_marker, 1)[1]
                      character[field] = (
                          f'{pages_base_path}/assets/{relative}'
                      )
                  elif storage_marker in path:
                      relative = path.split(storage_marker, 1)[1]
                      character[field] = (
                          f'{pages_base_path}/storage/{relative}'
                      )

          characters_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )

          # Mark this deployment as a read-only showcase and prevent upload
          # attempts from producing confusing network errors.
          static_script = r'''
          <script>
          document.addEventListener('DOMContentLoaded', () => {
              const form = document.querySelector('[data-character-form]');

              if (!form) return;

              form.setAttribute('novalidate', 'novalidate');

              form.addEventListener('submit', (event) => {
                  event.preventDefault();
                  event.stopImmediatePropagation();
                  window.alert('نسخه GitHub Pages نمایشی و فقط‌خواندنی است. مدیریت و آپلود کاراکترها به سرور Laravel نیاز دارد.');
              }, { capture: true });
          });
          </script>
          '''

          html = re.sub(
              r'</body>',
              static_script + '\n</body>',
              html,
              count=1,
              flags=re.IGNORECASE,
          )

          index_path.write_text(html, encoding='utf-8')
          (site / '404.html').write_text(html, encoding='utf-8')

          # The built-in fallback character uses root-relative public paths.
          # Prefix those paths with the repository base path for project Pages.
          for asset in (site / 'build').rglob('*.js'):
              source = asset.read_text(encoding='utf-8')
              source = source.replace(
                  '/assets/characters/tiam/',
                  f'{pages_base_path}/assets/characters/tiam/',
              )
              asset.write_text(source, encoding='utf-8')
          PYTHON

      - name: Validate static output
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PYTHON'
          import json
          import os
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          site = Path('_site')
          index = site / 'index.html'
          characters_file = site / 'characters.json'

          if not index.is_file() or index.stat().st_size == 0:
              raise SystemExit('ERROR: _site/index.html is missing or empty.')

          if not characters_file.is_file() or characters_file.stat().st_size == 0:
              raise SystemExit('ERROR: _site/characters.json is missing or empty.')

          html = index.read_text(encoding='utf-8')

          if 'TIAM' not in html and 'تیام' not in html:
              raise SystemExit('ERROR: TIAM heading was not found in index.html.')

          if '127.0.0.1:8000' in html or 'localhost:8000' in html:
              raise SystemExit('ERROR: Local Laravel URLs remain in index.html.')

          if 'characters.json' not in html:
              raise SystemExit('ERROR: Static Character Manager JSON URL was not injected.')

          payload = json.loads(characters_file.read_text(encoding='utf-8'))
          characters = payload.get('data', [])

          if not characters:
              raise SystemExit('ERROR: No characters were exported.')

          tiam = next(
              (character for character in characters if character.get('slug') == 'tiam'),
              None,
          )

          if not tiam:
              raise SystemExit('ERROR: TIAM was not found in characters.json.')

          repository_name = os.environ['GITHUB_REPOSITORY'].split('/', 1)[1]
          marker = f'/{repository_name}/'

          for field in ('sprite_url', 'atlas_url'):
              url = tiam.get(field)

              if not url:
                  raise SystemExit(f'ERROR: TIAM {field} is missing.')

              path = unquote(urlparse(url).path)

              if marker in path:
                  relative = path.split(marker, 1)[1]
              else:
                  relative = path.lstrip('/')

              target = site / relative

              if not target.is_file():
                  raise SystemExit(
                      f'ERROR: {field} does not point to a published file: '
                      f'{url} -> {target}'
                  )

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)

                  if tag == 'script' and attributes.get('src'):
                      self.urls.append(attributes['src'])

                  if tag == 'link' and attributes.get('href'):
                      rel = attributes.get('rel', '')
                      if 'stylesheet' in rel:
                          self.urls.append(attributes['href'])

          parser = AssetParser()
          parser.feed(html)

          if not parser.urls:
              raise SystemExit('ERROR: No Vite assets were referenced by index.html.')

          for url in parser.urls:
              path = unquote(urlparse(url).path)

              if marker in path:
                  relative = path.split(marker, 1)[1]
              else:
                  relative = path.lstrip('/')

              if not (site / relative).is_file():
                  raise SystemExit(
                      f'ERROR: HTML asset URL does not point to a published file: '
                      f'{url} -> {relative}'
                  )

          print('Demian static export validated successfully.')
          print(f'Characters exported: {len(characters)}')
          PYTHON

          echo "Published site size:"
          du -sh _site

          echo "Published files:"
          find _site -maxdepth 4 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: demian/_site

  deploy:
    name: Deploy Demian Arcade
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
