name: Deploy Demian mobile release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: demian-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    uses: ./.github/workflows/arcade-backend.yml
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demian/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: npm ci
      - run: npm run validate:skills
      - run: npm run validate:motion
      - run: npm run validate:cafe-presentation
      - run: npm run test:ci
      - run: npm run validate:final
      - run: npm run validate:ui-layers
      - run: npm run validate:characters:v14
      - run: npm run build:static
      # Expected one atomic JavaScript bundle; bundle_mode: atomic
      - run: npm run validate:build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:coffee-crash:browser
      - run: npm run test:identity:browser
      - run: npm run test:device-qa:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coffee-crash-browser-qa
          path: |
            demian/docs/release-v18-coffee-crash/browser
            demian/docs/project-identity/browser
            demian/docs/p0-stability/browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demian/_site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, backend]
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

