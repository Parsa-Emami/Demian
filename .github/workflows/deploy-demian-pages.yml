name: Deploy Demian mobile release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: demian-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    uses: ./.github/workflows/arcade-backend.yml
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: demian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: demian/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: npm ci
      - run: npm run validate:skills
      - run: npm run validate:motion
      - run: npm run validate:cafe-presentation
      - run: npm run test:ci
      - run: npm run validate:final
      - run: npm run validate:ui-layers
      - run: npm run validate:characters:v14
      - name: Build static release (API opt-in only after provisioning)
        run: npm run build:static
        env:
          DEMIAN_PUBLIC_ORIGIN: https://demiancafe.ir
          # Set only after domain DNS and GitHub Pages verification.
          DEMIAN_PAGES_CUSTOM_DOMAIN: ${{ vars.DEMIAN_PAGES_CUSTOM_DOMAIN || '' }}
          DEMIAN_ARCADE_API_URL: ${{ github.ref == 'refs/heads/main' && vars.DEMIAN_ARCADE_ENABLE_RANKED == 'true' && vars.DEMIAN_ARCADE_API_URL || '' }}
      - name: Validate optimized production assets
        run: npm run validate:static-assets
      - name: Package portable static PWA for cPanel public_html
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf "$RUNNER_TEMP/demiancafe-static.tar.gz" -C _site .
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: demiancafe-ir-static-site
          path: ${{ runner.temp }}/demiancafe-static.tar.gz
          retention-days: 7
          if-no-files-found: error
      # Expected one atomic JavaScript bundle; bundle_mode: atomic
      - run: npm run validate:build
      - run: npx playwright install chromium --only-shell
      - name: Install Firefox and WebKit for Phase 6 Step 31 engine compatibility
        run: npx playwright install --with-deps firefox webkit
      - run: npm run test:coffee-crash:browser
      - name: Phase 3 Step 13 dedicated wallet and weekly leaderboard Chromium acceptance
        run: timeout --signal=TERM --kill-after=10s 180s npm run test:weekly13:browser
      - name: Project identity browser QA (bounded)
        run: timeout --signal=TERM --kill-after=10s 180s npm run test:identity:browser
      - run: npm run test:device-qa:browser
      - name: Phase 4 Step 20 fast menu, all six games and delayed decorative assets
        run: timeout --signal=TERM --kill-after=10s 240s npm run test:fast-loading:browser
      - name: Phase 6 Step 30 fast cold startup, buffered menu click and all six games under 4G
        run: timeout --signal=TERM --kill-after=10s 240s npm run test:step30:startup
      - name: Phase 6 Step 31 mobile home and twelve character artwork QA
        run: timeout --signal=TERM --kill-after=10s 240s node tools/check_phase6_step31_mobile_home.mjs
      - name: Phase 6 Step 32 privacy, terms, contest rules and mobile browser navigation
        run: timeout --signal=TERM --kill-after=10s 120s npm run test:step32:legal
      - name: Phase 6 Step 31 all six games on Chromium, Firefox and WebKit plus offline/keyboard
        run: timeout --signal=TERM --kill-after=10s 300s npm run test:step31:compatibility
      - name: Phase 4 Step 21 audiovisual browser and FPS regression
        run: timeout --signal=TERM --kill-after=10s 120s npm run test:feedback:browser
      - name: Phase 5 Step 23 Dino Run desktop and mobile gameplay acceptance
        run: timeout --signal=TERM --kill-after=10s 240s npm run test:dino-step23:browser
      - name: Phase 5 Step 24 Open World exploration, streaming and lifecycle acceptance
        run: timeout --signal=TERM --kill-after=10s 240s npm run test:open-world-step24:browser
      - name: Phase 5 Step 25 After Hours night gameplay, power, score and lifecycle acceptance
        run: timeout --signal=TERM --kill-after=10s 300s npm run test:after-hours-step25:browser
      - name: Phase 5 Step 26 Café Rush multi-customer, tray, VIP and score browser acceptance
        run: timeout --signal=TERM --kill-after=10s 300s npm run test:cafe-rush-step26:browser
      - name: Phase 5 Step 27 Café Critters clue, album, hint and ranked-safe browser acceptance
        run: timeout --signal=TERM --kill-after=10s 300s npm run test:cafe-critters-step27:browser
      - name: Phase 5 Step 28 Coffee Crash seeded Match-3, undo, campaign and terminal browser acceptance
        run: timeout --signal=TERM --kill-after=10s 300s npm run test:coffee-crash-step28:browser
      - name: Phase 4 Step 18 pixel-exact release, slow-network and fallback browser regression
        run: timeout --signal=TERM --kill-after=10s 180s npm run test:loading:browser
        env:
          DEMIAN_BROWSER_RELEASE_DIR: _site
      - name: Mobile-04 Save-Data + network recovery regression
        run: npm run test:mobile-network:browser
      - name: Mobile-05 multitouch and orientation browser regression
        run: npm run test:mobile-touch:browser
      - name: Mobile-07 root/subpath fonts, PWA offline and reconnect
        run: npm run test:mobile-pwa:browser
      - name: Mobile-09 selective offline game downloads, reload and cleanup
        run: npm run test:mobile-09:browser
      - name: Mobile-01 mid-tier phone laboratory baseline
        run: npm run benchmark:mobile:ci
        env:
          DEMIAN_MOBILE_BENCH_PROFILE: mid-mobile
      - name: Mobile-01 low-end phone laboratory baseline
        run: npm run benchmark:mobile:ci
        env:
          DEMIAN_MOBILE_BENCH_PROFILE: low-mobile
      - name: Step 31 aggregate all QA evidence and enforce cold menu, six games and device caveats
        run: npm run test:step31:collect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step31-qa-${{ github.sha }}
          if-no-files-found: warn
          path: demian/docs/phase6-step31/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coffee-crash-browser-qa
          path: |
            demian/docs/release-v18-coffee-crash/browser
            demian/docs/project-identity/browser
            demian/docs/p0-stability/browser
            demian/docs/mobile-04/browser
            demian/docs/mobile-05/browser
            demian/docs/mobile-07/browser
            demian/docs/mobile-09/browser
            demian/docs/mobile-01/baseline
            demian/docs/mobile-02/release-asset-report.json
            demian/docs/phase4-step20/startup-and-game-loading.json
            demian/docs/phase4-step21/audiovisual-browser.json
            demian/docs/phase5-step23/dino-run-browser.json
            demian/docs/phase5-step23/dino-run-390-results.png
            demian/docs/phase5-step24/open-world-browser.json
            demian/docs/phase5-step24/open-world-390.png
            demian/docs/phase5-step25/after-hours-browser.json
            demian/docs/phase5-step25/after-hours-390-results.png
            demian/docs/phase5-step26/cafe-rush-browser.json
            demian/docs/phase5-step26/cafe-rush-390-results.png
            demian/docs/phase5-step27/cafe-critters-browser.json
            demian/docs/phase5-step27/cafe-critters-390-results.png
            demian/docs/phase5-step28/coffee-crash-browser.json
            demian/docs/phase5-step28/coffee-crash-390-results.png
            demian/docs/phase6-step30/startup.json
            demian/docs/phase6-step31/qa-evidence.json
            demian/docs/phase6-step31/browser-compatibility.json
            demian/docs/phase6-step31/mobile-characters-browser.json
            demian/docs/phase6-step31/mobile-home-*.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demian/_site
  release-qa:
    runs-on: ubuntu-24.04
    needs: [build, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: step31-qa-${{ github.sha }}
          path: ${{ runner.temp }}/step31
      - name: SHA-bound composite release QA, no forged production certification
        run: node demian/tools/qa/step31_verify.mjs "${RUNNER_TEMP}/step31/qa-evidence.json"
        env:
          DEMIAN_QA_BUILD_RESULT: ${{ needs.build.result }}
          DEMIAN_QA_BACKEND_RESULT: ${{ needs.backend.result }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [release-qa]
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

