name: Deploy Demian Arcade to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    # تنظیم پوشه پیش‌فرض برای اجرای دستورات با توجه به ساختار پروژه شما
    defaults:
      run:
        working-directory: ./demian

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick

      - name: 📦 Install PHP Dependencies (Composer)
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛠️ Install NPM Dependencies & Build Vite
        run: |
          npm ci
          npm run build

      - name: ⚙️ Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force

      - name: 🚀 Build Demian static demo
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # استارت کردن سرور لاراول در پس‌زمینه
          php artisan serve --host=127.0.0.1 --port=8000 > "${RUNNER_TEMP}/demian-laravel.log" 2>&1 &
          SERVER_PID=$!

          cleanup() {
            kill "${SERVER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          # لوپ برای اطمینان از بالا آمدن سرور بدون مشکل
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              echo "Laravel server is ready."
              break
            fi
            if [ "${attempt}" -eq 40 ]; then
              echo "ERROR: Laravel server did not become ready."
              cat "${RUNNER_TEMP}/demian-laravel.log" || true
              exit 1
            fi
            sleep 1
          done

          # انتقال فایل‌های پابلیک به پوشه سایت استاتیک
          cp -a public/. _site/

          rm -f _site/index.php
          rm -f _site/.htaccess
          rm -f _site/hot
          find _site -type l -delete
          touch _site/.nojekyll

          # رندر کردن Blade اصلی لاراول و ذخیره به عنوان یک صفحه HTML استاتیک
          curl --fail --silent http://127.0.0.1:8000/ > _site/index.html

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # مسیر آپلود آرتیفکت با توجه به تنظیمات working-directory
          path: './demian/_site' 

      - name: 🌍 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4