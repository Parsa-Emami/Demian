name: Mobile-11 operations contracts
# Required checks cannot be path-filtered, or unrelated PRs remain pending forever.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release shell syntax
        run: |
          bash -n demian/ops/mobile-11/release.sh
          bash -n demian/ops/github/main_branch_protection.sh
          bash -n demian/ops/mobile-11/backup_mysql.sh
          bash -n demian/ops/mobile-11/ci_mysql_restore.sh
          bash -n demian/ops/cpanel/deploy.sh
          bash -n demian/ops/cpanel/cron.sh
          bash -n demian/ops/cpanel/rollback.sh
          bash -n demian/ops/cpanel/backup_offsite.sh
          bash -n demian/ops/cpanel/restore_drill.sh
          bash -n demian/ops/cpanel/package_release.sh
          bash -n demian/ops/cpanel/ci_release_acceptance.sh
          php -l demian/ops/cpanel/host_preflight.php
          php -l demian/ops/cpanel/install_webroot_bridge.php
      - name: Check approved read-only load profile
        run: node --check demian/tools/load/mobile11_read_only.js
      - name: Validate actual 50-live-client load profile
        run: |
          node --check demian/tools/load/cpanel_50_active.js
          node --check demian/tools/load/cpanel_50_writes_staging.js
          node --check demian/tools/load/cpanel_50_verified_replays_staging.js
          node --check demian/tools/load/runner_first_collision.js
          node --check demian/tools/qa/phase11_release_policy.mjs
          node --check demian/tools/qa/phase11_release_audit.mjs
          node --check demian/tools/qa/phase11_verify_ci.mjs
          node --check demian/tools/qa/phase11_remote_smoke.mjs
      - name: Verify main protection policy, all-check triggers and safe admin enforcement
        run: node --test demian/tests/js/mobile/BranchProtectionPolicy.test.js
      - name: Run release and integrity guard tests
        working-directory: demian
        run: node --test tests/js/mobile/Mobile11Ops.test.js tests/js/mobile/CpanelHostSmoke.test.js tests/js/mobile/ReleaseRollback.test.js tests/js/mobile/CpanelDeployment.test.js tests/js/mobile/Phase10CpanelOps.test.js tests/js/mobile/Phase10LoadAssessment.test.js tests/js/mobile/Phase11ReleaseAudit.test.js tests/js/mobile/Phase11ReleasePolicy.test.js tests/js/mobile/Phase11CompositeCi.test.js tests/js/mobile/Phase11ProtectedWorkflow.test.js tests/js/mobile/Phase11RemoteSmoke.test.js tests/js/mobile/Pr06ReleasePackage.test.js

  cpanel-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, pdo_mysql, curl, fileinfo
          coverage: none
      - name: Locked production dependencies and API-only route isolation
        working-directory: demian
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DEMIAN_ARCADE_API_ONLY: 'true'
          CACHE_STORE: array
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          set -Eeuo pipefail
          composer install --no-interaction --no-dev --prefer-dist --optimize-autoloader
          php artisan optimize
          php artisan route:list --json | php -r '
            $routes = json_decode(stream_get_contents(STDIN), true);
            if (!is_array($routes)) exit(1);
            $hasApi = false;
            foreach ($routes as $route) {
              $uri = $route["uri"] ?? "";
              if ($uri === "/" || $uri === "characters" ||
                  str_starts_with($uri, "characters/")) exit(1);
              if ($uri === "api/v1/arcade/health") $hasApi = true;
            }
            exit($hasApi ? 0 : 1);
          '
          # Never ship precomputed configuration/routes from a CI environment.
          tar --exclude='bootstrap/cache/*.php' -czf "$RUNNER_TEMP/cpanel-api.tar.gz" \
            artisan app bootstrap config database routes resources/game resources/legal \
            resources/views src public/index.php public/.htaccess \
            ops/cpanel/host_preflight.php composer.json composer.lock vendor
          test -s "$RUNNER_TEMP/cpanel-api.tar.gz"
          tar -tzf "$RUNNER_TEMP/cpanel-api.tar.gz" > "$RUNNER_TEMP/cpanel-entries.txt"
          grep -Fx 'artisan' "$RUNNER_TEMP/cpanel-entries.txt" >/dev/null
          grep -Fx 'ops/cpanel/host_preflight.php' "$RUNNER_TEMP/cpanel-entries.txt" >/dev/null
          php tests/ops/CpanelHostPreflightTest.php
          php tests/ops/CpanelBridgeInstallTest.php
          if grep -Eq '(^|/)([.]env|[.]git)(/|$)' "$RUNNER_TEMP/cpanel-entries.txt"; then
            echo "Forbidden secret file in release" >&2; exit 1
          fi
