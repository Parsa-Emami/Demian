<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111b19">
  <title>دمیان — اتصال برقرار نیست</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { min-height: 100dvh; display: grid; place-items: center; margin: 0;
      background: radial-gradient(circle at top right, #1f3b36, #0b1115 68%);
      color: #f4f7f3; padding: 20px; box-sizing: border-box; }
    main { width: min(100%, 440px); text-align: center; border: 1px solid #52746c;
      border-radius: 24px; padding: 30px 22px; background: #131e21; }
    h1 { margin: 0 0 14px; font-size: 1.6rem; }
    p { line-height: 1.95; color: #c9d5d0; }
    button { min-height: 48px; min-width: 48px; border: 1px solid #9ad5c0;
      background: #265549; color: white; padding: 12px 22px; font: inherit;
      border-radius: 12px; cursor: pointer; }
    button:focus-visible { outline: 3px solid #f5dd90; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>دمیان فعلاً آفلاین است</h1>
    <p>برای ورود به بازی و ثبت امتیاز در لیدربورد هفتگی به اینترنت نیاز داری.
      پس از وصل‌شدن دوباره تلاش کن. هیچ امتیازی در این صفحه ارسال یا ثبت نمی‌شود.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>
