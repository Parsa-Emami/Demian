<!doctype html>
<meta charset="utf-8">
<title>Demian environment bake</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { gunzipSync } from 'three/addons/libs/fflate.module.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setClearColor('#d9d2c4');
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff3dc, 0x8193a4, 1.8));
const key = new THREE.DirectionalLight(0xffe6bf, 1.8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.normalBias = .035;
key.shadow.bias = -.00015;
Object.assign(key.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: .1, far: 250 });
scene.add(key, key.target);
const fill = new THREE.DirectionalLight(0xc9deed, .45);
fill.position.set(20, 40, -15);
scene.add(fill);
const bytes = new Uint8Array(await (await fetch('/public/assets/environments/demian-fbx/cafe.glb.gz')).arrayBuffer());
const raw = bytes[0] === 0x1f && bytes[1] === 0x8b ? gunzipSync(bytes) : bytes;
const model = (await new GLTFLoader().parseAsync(raw.buffer.slice(raw.byteOffset, raw.byteOffset + raw.byteLength), '')).scene;
model.traverse(object => {
    if (object.userData.overhead) object.visible = false;
    if (object.isMesh) { object.castShadow = true; object.receiveShadow = true; }
});
scene.add(model);
window.bakeTile = ({ bounds, width, height }) => {
    renderer.setSize(width, height, false);
    const centerX = (bounds.minX + bounds.maxX) / 2;
    const centerZ = (bounds.minZ + bounds.maxZ) / 2;
    const camera = new THREE.OrthographicCamera(
        bounds.minX - centerX, bounds.maxX - centerX,
        (bounds.maxZ - bounds.minZ) / 2, -(bounds.maxZ - bounds.minZ) / 2, .1, 220
    );
    camera.up.set(0, 0, -1);
    camera.position.set(centerX, 150, centerZ);
    camera.lookAt(centerX, 0, centerZ);
    camera.updateMatrixWorld();
    key.position.set(centerX - 10, 140, centerZ + 16);
    key.target.position.set(centerX, 0, centerZ);
    key.target.updateMatrixWorld();
    renderer.shadowMap.needsUpdate = true;
    const composer = new EffectComposer(renderer);
    composer.setSize(width, height);
    const render = new RenderPass(scene, camera);
    const ao = new GTAOPass(scene, camera, width, height);
    ao.updateGtaoMaterial({ radius: .9, distanceExponent: 1.5, thickness: 1.2, samples: 16 });
    ao.updatePdMaterial({ radius: 4, samples: 16 });
    ao.blendIntensity = .75;
    const output = new OutputPass();
    composer.addPass(render);
    composer.addPass(ao);
    composer.addPass(output);
    composer.render();
    const image = renderer.domElement.toDataURL('image/png');
    ao.dispose(); output.dispose(); composer.dispose();
    return { image, triangles: renderer.info.render.triangles, calls: renderer.info.render.calls };
};
window.sceneReady = true;
</script>
